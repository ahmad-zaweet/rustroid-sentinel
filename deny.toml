[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = [
    # RUSTSEC-2023-0071: rsa crate Marvin Attack
    # Only affects MySQL connections, we use PostgreSQL
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"
wildcards = "allow" # Allow wildcards in Cargo.toml
deny = [
    # Deny known insecure crates
    { name = "openssl", reason = "Use rustls instead for better security" },
]
skip = []
skip-tree = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
]
confidence-threshold = 0.8
allow-osi-fsf-free = "neither"
copyleft = "deny"
unlicensed = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
