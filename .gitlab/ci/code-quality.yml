image: rust:$RUST_VERSION

compilation-check:
  stage: quality
  script:
    - cargo fetch
    - cargo check --workspace --all-targets --locked
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "*.rs"
        - "*.html"

formatting-check:
  stage: quality
  script:
    - rustup component add clippy rustfmt
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "*.rs"
