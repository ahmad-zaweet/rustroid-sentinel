etl_pipeline:
  stage: run-etl-pipeline
  image:
    name: $CI_REGISTRY_IMAGE:latest
    entrypoint: [""] 

  script:
    - set -e
    - echo "Starting Rustroid Sentinel pipeline..."
    - rustroid-sentinel pipeline --skip-report
    - echo "Pipeline completed successfully"

  resource_group: etl-pipeline

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"