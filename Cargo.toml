[package]
name = "rustroid-sentinel"
description = "A high-performance backend system for extracting and analyzing NASA near-Earth object (NEO) data with real-time alerting, observability, and REST API capabilities"
authors = ["Ahmad Zaweet <ahmad.zaweet@gmail.com>"]
readme = "README.md"
keywords = ["nasa", "asteroid", "etl", "observability", "api"]
categories = ["science", "web-programming::http-server", "database-implementations"]
repository = "https://gitlab.com/AhmadZaweet/rustroid-sentinel"
version = "1.0.0"
edition = "2024"

[lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
large_enum_variant = "warn"

[dependencies]
# Async runtime and web framework
axum = { version = "0.8.9", features = ["http2"], optional = true }
tokio = { version = "1.52.*", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
    "sync",
    "fs",
] }
tower = { version = "0.5.*", features = [
    "limit",
    "timeout",
    "util",
], optional = true }
tower-http = { version = "0.6.*", features = [
    "cors",
    "trace",
    "fs",
    "timeout",
    "compression-gzip",
    "limit",
], optional = true }
axum-governor = { version = "2.0.*", optional = true }
axum-helmet = { version = "1.0.*", optional = true }
real = { version = "0.1", features = ["axum"], optional = true }
helmet-core = { version = "1.0", optional = true }
lazy-limit = { version = "1", optional = true }
cached = { version = "2.0.*", optional = true, features = ["time_stores"] }

# Database
sqlx = { version = "0.9.*", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "chrono",
    "macros",
] }

# HTTP client with middleware
reqwest = { version = "0.13.*", default-features = false, features = [
    "json",
    "gzip",
    "http2",
    "rustls",
    "stream"
] }
reqwest-middleware = "0.5.*"
reqwest-retry = "0.9.*"

# Stream utilities
futures-util = "0.3.*"

# Configuration management
config = { version = "0.15.*", features = [
    "toml",
], default-features = false }

# Serialization
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
base64 = "0.22.*"
bytes = "1"

# Date/Time
chrono = { version = "0.4.*", features = ["serde"] }

# UUIDs
uuid = { version = "1.23.*", features = ["v4", "v5", "serde"] }

# Logging and tracing
tracing = "0.1.*"
tracing-subscriber = { version = "0.3.*", features = ["env-filter", "json"] }

# Metrics and Tracing
prometheus = { version = "0.14", optional = true }
opentelemetry = { version = "0.31", features = ["metrics", "trace"], optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "metrics", "trace"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "metrics", "trace"], optional = true }
opentelemetry-http = { version = "0.31", optional = true }
opentelemetry-semantic-conventions = { version = "0.31", features = ["semconv_experimental"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
urlencoding = "2.1"

once_cell = "1.21"
gethostname = "1.1"

# Error handling
anyhow = "1.0.*"
thiserror = "2.0.*"

# CLI
clap = { version = "4.6.*", features = ["derive", "env"] }
prettytable-rs = "0.10.*"
serenity = { version = "0.12.*", default-features = false, features = [
    "rustls_backend",
    "gateway",
    "model",
    "client",
    "http",
], optional = true }
askama = { version = "0.16.*", optional = true }
dotenvy = "0.15.*"

[features]
default = ["api", "alerting", "metrics", "etl"]
api = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:axum-governor",
    "dep:axum-helmet",
    "dep:real",
    "dep:helmet-core",
    "dep:lazy-limit",
    "dep:askama",
]
alerting = ["dep:serenity"]
metrics = [
    "dep:prometheus",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-http",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry"
]
etl = []

[dev-dependencies]
# Async testing - Latest stable as of 2026
tokio = { version = "1.52.*", features = ["full", "test-util"] }
tokio-test = "0.4.5"

# HTTP mocking - Latest stable versions
wiremock = "0.6.5"
mockito = "1.7.2"

# Trait mocking - Latest stable
mockall = "0.14.*"

# Database testing - Using bollard instead of testcontainers (RUSTSEC issues)
# testcontainers has dependency vulnerabilities (RUSTSEC-2024-0384 via instant)
bollard = "0.18"  # Modern Docker API client, secure alternative
sqlx = { version = "0.9.*", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }

# Assertion libraries - Latest stable
assert-json-diff = "2.0.2"
insta = { version = "1.47", features = ["json", "redactions"] }

# Property-based testing - Latest stable
proptest = "1.11"

# Test utilities - Latest stable
tempfile = "3.27"
rand = "0.9"

# SQLx CLI for database management
sqlx-cli = { version = "0.8.6", default-features = false, features = ["postgres", "rustls", "completions"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
