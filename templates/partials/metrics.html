<!-- Metrics Row — Inline Editorial Partial -->
<div class="flex items-center gap-6 sm:gap-9 flex-wrap">
    <div class="flex items-baseline gap-2">
        <span class="font-mono text-[9px] tracking-[0.18em] text-[#8A83A8] uppercase">REQ/S</span>
        <span class="font-mono text-xs sm:text-[12.5px] text-[#4FE8DC] font-semibold" id="metric-rps">{{ requests_per_second }}</span>
    </div>
    <div class="flex items-baseline gap-2">
        <span class="font-mono text-[9px] tracking-[0.18em] text-[#8A83A8] uppercase">ERRORS</span>
        <span class="font-mono text-xs sm:text-[12.5px] {{ error_rate_class }} font-semibold" id="metric-error-rate">{{ error_rate_percent }}</span>
    </div>
    <div class="flex items-baseline gap-2">
        <span class="font-mono text-[9px] tracking-[0.18em] text-[#8A83A8] uppercase">LATENCY</span>
        <span class="font-mono text-xs sm:text-[12.5px] text-[#C3BEDA] font-semibold" id="metric-latency">{{ avg_response_time_ms }}</span>
    </div>
    <div class="flex items-baseline gap-2">
        <span class="font-mono text-[9px] tracking-[0.18em] text-[#8A83A8] uppercase">DB/S</span>
        <span class="font-mono text-xs sm:text-[12.5px] text-[#C3BEDA] font-semibold" id="metric-db-qps">{{ db_queries_per_second }}</span>
    </div>
    <div class="flex items-baseline gap-2">
        <span class="font-mono text-[9px] tracking-[0.18em] text-[#8A83A8] uppercase">CACHE HIT</span>
        <span class="font-mono text-xs sm:text-[12.5px] {{ cache_hit_rate_class }} font-semibold" id="metric-cache-hit-rate">{{ cache_hit_rate_percent }}</span>
    </div>
    <div class="flex items-baseline gap-2">
        <span class="font-mono text-[9px] tracking-[0.18em] text-[#8A83A8] uppercase">STORAGE</span>
        <span class="font-mono text-xs sm:text-[12.5px] {{ storage_class }} font-semibold" id="metric-storage">{{ storage_used_percent }}</span>
    </div>
</div>
