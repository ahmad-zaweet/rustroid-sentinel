<header class="glass-header sticky top-0 z-50 relative overflow-hidden">
    <!-- Animated scan sweep across bottom border -->
    <div class="header-scan" aria-hidden="true"></div>

    <div
        class="container mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3"
    >
        <!-- Logo + Brand Identity -->
        <div class="flex items-center gap-3 flex-shrink-0">
            <div class="logo-hex">
                <i
                    data-lucide="satellite"
                    class="w-5 h-5 text-nebula-purple relative z-10"
                ></i>
            </div>
            <div class="leading-tight">
                <h1
                    class="text-base sm:text-lg font-heading font-bold gradient-text tracking-tight leading-none"
                >
                    RUSTROID SENTINEL
                </h1>
                <p
                    class="text-[9px] sm:text-[10px] font-mono text-text-muted uppercase tracking-[0.14em] mt-0.5"
                >
                    NEO Monitoring System
                </p>
            </div>
        </div>

        <!-- Right: Status + Social Links -->
        <div class="flex items-center gap-3 sm:gap-4">
            <!-- Live status badge -->
            <div
                class="flex items-center gap-2 px-3 py-1.5 glass-card rounded-full status-badge status-live"
            >
                <span
                    class="w-1.5 h-1.5 rounded-full status-dot status-dot-live"
                    id="connection-status"
                ></span>
                <span class="hidden xs:inline" id="status-text"
                    >CONNECTING</span
                >
            </div>

            <!-- Social links — hidden on smallest screens -->
            <div class="flex items-center gap-3.5">
                <a
                    href="https://gitlab.com/AhmadZaweet/rustroid-sentinel"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="tooltip-link text-text-muted hover:text-nebula-purple transition-colors duration-250"
                    aria-label="GitLab"
                    data-tooltip="Source on GitLab"
                >
                    <i data-lucide="gitlab" class="w-4 h-4"></i>
                </a>
                <a
                    href="https://discord.gg/GHT55B3Mdp"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="tooltip-link text-text-muted hover:text-nebula-blue transition-colors duration-250"
                    aria-label="Discord"
                    data-tooltip="Join Discord for alerts"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        class="w-4 h-4"
                        width="16"
                        height="16"
                    >
                        <path
                            d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"
                        />
                    </svg>
                </a>
                <a
                    href="https://linkedin.com/in/ahmad-zaweet"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="tooltip-link text-text-muted hover:text-nebula-cyan transition-colors duration-250"
                    aria-label="LinkedIn"
                    data-tooltip="Connect on LinkedIn"
                >
                    <i data-lucide="linkedin" class="w-4 h-4"></i>
                </a>
            </div>
        </div>
    </div>
</header>
